# Postgres is not published to the network: only the bot can reach it.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: commonplace
      POSTGRES_PASSWORD: commonplace
      POSTGRES_DB: commonplace
    volumes:
      - commonplace-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commonplace"]
      interval: 5s
      retries: 10
  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://commonplace:commonplace@db:5432/commonplace
volumes:
  commonplace-db:
